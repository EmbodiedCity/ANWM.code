run_name: nwm_cdit_airvln_v6

# training setup
results_dir: logs
train: True
batch_size: 2
num_workers: 12
model: CDiT-XL/2
lr: 8e-5

# normalization for the action space
normalize: True
grad_clip_val: 10.0
context_size: 4

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: -64
  max_dist_cat: 64

# action output params
len_traj_pred: 64

# dataset specific parameters
image_size: 224
datasets:
  airvln_16:
    data_folder: data/airvln_16
    train: data_splits/airvln_16/train/ # path to train folder with traj_names.txt
    test: data_splits/airvln_16/test/ # path to test folder with traj_names.txt
    goals_per_obs: 4
  airvln_1episode:
    data_folder: data/airvln_1episode
    train: data_splits/airvln_1episode/train/ # path to train folder with traj_names.txt
    test: data_splits/airvln_1episode/test/ # path to test folder with traj_names.txt
    goals_per_obs: 4
