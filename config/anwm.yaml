run_name: anwm_cdit_airvln
results_dir: logs

train: true
batch_size: 1
num_workers: 12
model: CDiT-XL/2
lr: 8e-5

normalize: true
grad_clip_val: 10.0
context_size: 16
distance:
  min_dist_cat: -64
  max_dist_cat: 64
len_traj_pred: 16
image_size: 224

datasets:
  airvln_16:
    data_folder: data/airvln_16
    train: data/splits/airvln_16/train
    test: data/splits/airvln_16/test
    goals_per_obs: 4
