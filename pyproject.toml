[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anwm"
version = "0.1.0"
description = "Aerial World Model for Long-horizon Visual Generation and Navigation in 3D Space"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "accelerate",
  "diffusers",
  "matplotlib",
  "numpy",
  "opencv-python",
  "Pillow",
  "PyYAML",
  "scipy",
  "timm",
  "torch",
  "torchvision",
  "tqdm",
]

[project.optional-dependencies]
metrics = ["dreamsim", "lpips", "torcheval"]
real = ["evo", "lpips"]

[tool.setuptools.packages.find]
include = ["anwm*", "real*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["F"]
